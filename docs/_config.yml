title: LabelBridge
description: LabelBridge is a Flask-based middleware that connects Label Studio with NLP models and LLMs by translating input and output data formats.
theme: just-the-docs
show_downloads: true
baseurl: ""
url: "https://github.com/Partha11/flask-proxy"
source: .
include:
  - docs

defaults:
  - scope:
      path: "docs"
    values:
      permalink: /:basename/
repository: Partha11/flask-proxy
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false